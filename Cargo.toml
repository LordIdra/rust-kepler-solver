[package]
name = "rust-kepler-solver"
description = "Efficient solvers for the elliptical and hyperbolic Kepler equation"
repository = "https://github.com/LordIdra/rust-kepler-solver"
keywords = ["kepler", "orbits", "kepler-equation"]
categories = ["aerospace::simulation", "mathematics", "science"]
license = "MIT"
version = "0.1.1"
edition = "2024"

[dependencies]
lazy_static = "1.4.0"
serde = { version = "1.0.195", features = ["derive"] }
fast-math = "0.1"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
rand = "0.10.2"

[build-dependencies]
cc = "1.2.14"

[[bench]]
name = "ellipse"
harness = false

[[bench]]
name = "hyperbola"
harness = false

[profile.bench]
debug = true

[profile.samply]
inherits = "release"
debug = true
